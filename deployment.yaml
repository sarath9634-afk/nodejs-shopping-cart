apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-shopping-cart
  labels:
    app: nodejs-shopping-cart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodejs-shopping-cart
  template:
    metadata:
      labels:
        app: nodejs-shopping-cart
    spec:
      containers:
        - name: nodejs-shopping-cart
          image: acrtestsarath.azurecr.io/nodejs-shopping-cart:latest
          ports:
            - containerPort: 3000
 
