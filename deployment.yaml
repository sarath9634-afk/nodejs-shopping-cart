apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-shopping-cart
  labels:
    app: nodejs-shopping-cart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodejs-shopping-cart
  template:
    metadata:
      labels:
        app: nodejs-shopping-cart
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nodejs-shopping-cart
          image: acrtestsarath.azurecr.io/nodejs-shopping-cart:1
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
              ephemeral-storage: "512Mi"
